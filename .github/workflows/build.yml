# Собирает exe на сервере GitHub, когда ты публикуешь релиз, и прикладывает его к этому релизу.
# Тег vX.Y.Z - Majestic Tools (MajesticTools.exe), тег pm-vX.Y.Z - отдельная программа Majestic PM (MajesticPM.exe).
name: Сборка exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Номер версии из релиза
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "0.0.0-manual" }
          if ($tag.StartsWith("pm-")) {
            $tag = $tag.Substring(3)
            "APP=MajesticPM`nSCRIPT=pm_tools.py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "APP=MajesticTools`nSCRIPT=majestic_tools.py" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          $v = $tag.TrimStart("v", "V")
          "__version__ = `"$v`"`nREPO = `"${{ github.repository }}`"`n" | Set-Content -Path version.py -Encoding utf8
          Get-Content version.py

      - name: Сборка
        run: pyinstaller --onefile --noconsole --uac-admin --clean --collect-data certifi --hidden-import certifi --add-data "woodcut_assets.npz;." --add-data "mining_assets.npz;." --add-data "gym_assets.npz;." --name ${{ env.APP }} ${{ env.SCRIPT }}

      - name: Приложить exe к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.APP }}.exe

      - name: Сохранить exe (ручной запуск)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}
          path: dist/${{ env.APP }}.exe
