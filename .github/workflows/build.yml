# Собирает MajesticTools.exe на сервере GitHub, когда ты публикуешь релиз,
# и прикладывает exe к этому релизу. Программы у всех сами его подхватят.
name: Сборка exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Библиотеки
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Номер версии из релиза
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          if (-not $tag) { $tag = "0.0.0-manual" }
          $v = $tag.TrimStart("v", "V")
          "__version__ = `"$v`"`nREPO = `"${{ github.repository }}`"`n" | Set-Content -Path version.py -Encoding utf8
          Get-Content version.py

      - name: Сборка
        run: pyinstaller --onefile --noconsole --uac-admin --clean --name MajesticTools majestic_tools.py

      - name: Приложить exe к релизу
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MajesticTools.exe

      - name: Сохранить exe (ручной запуск)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: MajesticTools
          path: dist/MajesticTools.exe
